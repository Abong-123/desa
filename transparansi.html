<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transparansi – Desa Tirtomulyo</title>
  <link rel="stylesheet" href="dist/output.css" />
</head>
<body class="bg-slate-50 font-sans text-slate-800">
  <div id="nav"></div>
  <main class="container-desa space-y-12 py-10">
    <header>
      <h1 class="h-section">Transparansi Dana Desa <span id="thn"></span></h1>
      <p class="text-sm text-slate-500">Ringkasan pelaporan, bukan rincian transaksi.</p>
    </header>

    <section id="ringkas" class="grid gap-4 md:grid-cols-3"></section>

    <section>
      <h2 class="text-xl font-bold text-brand-900">Sumber Pendapatan</h2>
      <div id="pendapatan" class="mt-4 grid gap-3 sm:grid-cols-2"></div>
    </section>

    <section>
      <h2 class="text-xl font-bold text-brand-900">Realisasi Belanja per Bidang</h2>
      <div id="belanja" class="card mt-4 space-y-5"></div>
    </section>

    <section>
      <h2 class="text-xl font-bold text-brand-900">Kegiatan Utama & Progres</h2>
      <div id="kegiatan" class="mt-4 grid gap-4 md:grid-cols-2"></div>
    </section>

    <section>
      <h2 class="text-xl font-bold text-brand-900">Dokumen Laporan</h2>
      <div id="laporan" class="mt-4 space-y-3"></div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="js/data.js"></script><script src="js/layout.js"></script>
  <script>
    renderLayout("transparansi.html");
    document.getElementById("thn").textContent = DANA.tahun;
    const tp = DANA.pendapatan.reduce((s, x) => s + x.nilai, 0);
    const ta = DANA.belanja.reduce((s, x) => s + x.anggaran, 0);
    const tr = DANA.belanja.reduce((s, x) => s + x.realisasi, 0);
    const box = (l, v, e) => `<div class="card"><div class="text-2xl">${e}</div><p class="text-xs text-slate-500">${l}</p><p class="text-xl font-extrabold text-brand-700">${v}</p></div>`;
    document.getElementById("ringkas").innerHTML =
      box("Total Pendapatan", rupiah(tp), "💰") + box("Total Anggaran Belanja", rupiah(ta), "📋") + box("Terealisasi", `${rupiah(tr)} (${Math.round(tr / ta * 100)}%)`, "✅");
    document.getElementById("pendapatan").innerHTML = DANA.pendapatan.map(x =>
      `<div class="card flex items-center justify-between"><span class="text-sm">${x.sumber}</span><b class="text-brand-700">${rupiah(x.nilai)}</b></div>`).join("");
    const bar = (pct, color = "bg-brand-500") => `<div class="h-3 w-full overflow-hidden rounded-full bg-slate-100"><div class="h-full ${color}" style="width:${pct}%"></div></div>`;
    document.getElementById("belanja").innerHTML = DANA.belanja.map(b => {
      const pct = Math.round(b.realisasi / b.anggaran * 100);
      return `<div><div class="mb-1 flex flex-wrap justify-between gap-1 text-sm"><b>${b.bidang}</b><span class="text-slate-500">${rupiah(b.realisasi)} / ${rupiah(b.anggaran)} (${pct}%)</span></div>${bar(pct)}</div>`;
    }).join("");
    document.getElementById("kegiatan").innerHTML = DANA.kegiatan.map(k =>
      `<div class="card"><span class="badge">${k.bidang}</span><h3 class="mt-2 font-bold">${k.nama}</h3><p class="text-sm text-slate-500">Nilai: ${rupiah(k.nilai)}</p>
       <div class="mt-3">${bar(k.progres, k.progres === 100 ? "bg-green-500" : "bg-earth-500")}</div><p class="mt-1 text-right text-xs font-semibold">${k.progres}% selesai</p></div>`).join("");
    document.getElementById("laporan").innerHTML = DANA.laporan.map(l =>
      `<div class="card flex items-center justify-between"><div><p class="font-semibold">📄 ${l.judul}</p><p class="text-xs text-slate-500">${tgl(l.tgl)}</p></div>
       <span class="flex items-center gap-3"><span class="badge ${l.status === "Draft" ? "!bg-amber-100 !text-amber-700" : ""}">${l.status}</span><a href="#" class="btn-outline" onclick="alert('Dummy: tautkan ke file PDF laporan');return false;">Unduh</a></span></div>`).join("");
  </script>
</body>
</html>
