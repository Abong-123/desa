<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wisata & Budaya – Desa Wisata Taman Sari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dist/output.css" />
</head>
<body>
  <div id="nav"></div><div id="hero"></div>
  <main class="wrap space-y-24 py-16">
    <section>
      <p class="eyebrow">Destinasi</p><h2 class="h2">Tempat yang bisa Anda kunjungi</h2>
      <div id="filter" class="mt-6 flex flex-wrap gap-2"></div>
      <div id="list" class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>

    <section>
      <p class="eyebrow">Paket Wisata</p><h2 class="h2">Pilih cara menikmati desa</h2>
      <div id="paket" class="mt-8 grid gap-6 md:grid-cols-3"></div>
    </section>

    <section>
      <p class="eyebrow">Seni & Budaya</p><h2 class="h2">Warisan yang dirawat bersama</h2>
      <div id="budaya" class="mt-8 grid grid-cols-2 gap-4 md:grid-cols-4"></div>
    </section>

    <section class="grid gap-10 lg:grid-cols-2">
      <div><p class="eyebrow">Etika Berkunjung</p><h2 class="h2">Hormati desa, nikmati sepenuhnya</h2></div>
      <ul id="etika" class="space-y-3"></ul>
    </section>

    <section>
      <p class="eyebrow">Galeri</p><h2 class="h2">Suasana desa</h2>
      <div id="galeri" class="mt-8 columns-2 gap-4 md:columns-4"></div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="js/data.js"></script><script src="js/layout.js"></script>
  <script>
    renderLayout("wisata.html", false);
    pageHero("Wisata & Budaya", "Sawah subak, hutan monyet, pura, kampung nelayan, dan pentas seni, semuanya dikelola warga.", "sawah3.jpg");

    const kats = ["Semua", ...new Set(WISATA.map(w => w.kat))]; let aktif = "Semua";
    function draw() {
      $("filter").innerHTML = kats.map(k => `<button data-k="${k}" class="chipbtn ${k === aktif ? "on" : ""}">${k}</button>`).join("");
      $("list").innerHTML = WISATA.filter(w => aktif === "Semua" || w.kat === aktif).map(wisataCard).join("");
      document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { aktif = b.dataset.k; draw(); });
      reveal();
    }
    draw();

    $("paket").innerHTML = PAKET.map((p, i) => `<article class="card reveal p-7 ${i === 1 ? "!border-gold-500 ring-1 ring-gold-500" : ""}"><p class="text-xs font-semibold uppercase tracking-widest text-gold-600">${p.d}</p><h3 class="mt-2 font-display text-2xl font-semibold text-forest-900">${p.n}</h3><p class="mt-3 font-display text-3xl text-forest-800">${p.h}<span class="text-sm text-forest-900/50"> /orang</span></p><ul class="mt-5 space-y-2 text-sm">${p.i.map(x => `<li>✓ ${x}</li>`).join("")}</ul><a href="https://wa.me/${DESA.wa}?text=${encodeURIComponent("Halo, saya ingin memesan paket " + p.n)}" target="_blank" class="btn mt-6 w-full">Pesan Paket</a></article>`).join("");

    $("budaya").innerHTML = BUDAYA.map(b => `<div class="reveal group relative h-64 overflow-hidden rounded-2xl">${pic(b.img, b.t, "absolute inset-0 h-full w-full object-cover transition duration-700 group-hover:scale-110", true)}<div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-black/75 via-transparent"></div><div class="pointer-events-none absolute bottom-0 p-4 text-white"><p class="font-display text-lg font-semibold">${b.t}</p><p class="text-xs text-white/75">${b.d}</p></div></div>`).join("");

    $("etika").innerHTML = ["Kenakan pakaian adat (kamen & selendang) saat memasuki pura; tersedia sewa di loket.", "Perempuan yang sedang berhalangan tidak diperkenankan memasuki area utama pura.", "Jangan menaiki atau menginjak sesajen (canang) di jalan dan pelataran.", "Simpan makanan dan barang berharga dari monyet; jangan memberi makan sembarangan.", "Minta izin sebelum memotret warga yang sedang bersembahyang.", "Bawa pulang sampah Anda dan hargai ketenangan desa."].map(t => `<li class="reveal flex gap-3 rounded-xl border border-sand-200 bg-white p-4 text-sm"><span class="text-gold-600">❖</span>${t}</li>`).join("");

    $("galeri").innerHTML = ["sawah1.jpg", "taman_bermain.jpg", "nelayan1.jpg", "sawah2.jpg", "kapal_ikan.jpg", "upacara_adat1.jpg", "nelayan2.jpg", "taman.jpg", "sawah3.jpg", "rumah_adat.jpg", "tambak.jpg", "pasar_tradisional.jpg"]
      .map(f => `<div class="reveal mb-4 break-inside-avoid overflow-hidden rounded-2xl">${pic(f, "Galeri desa", "w-full cursor-zoom-in transition duration-500 hover:scale-105", true)}</div>`).join("");
    reveal();
  </script>
</body>
</html>
